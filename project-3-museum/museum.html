<!DOCTYPE html>
<html>
    <head>
        <title>Museum Painting</title>
        <link rel="stylesheet" href="museum.css">
    </head>

    <body>
        <h2>MUSEUM PAINTING</h2>
        <p>Lion felling a bull, from a marble pediment (The Met)</p>

        <section class="wall">

            <div class="sculpture">
                <!-- bull -->
                <div class="bull-body"></div>
                <div class="bull-head"></div>
                <div class="bull-eye"></div>
                <div class="bull-ear"></div>
                <div class="rib rib1"></div>
                <div class="rib rib2"></div>
                <div class="rib rib3"></div>
                <div class="rib rib4"></div>
                <div class="rib rib5"></div>

                <!-- broken piece on the right -->
                <div class="broken-piece"></div>

                <!-- lion -->
                <div class="lion-body"></div>
                <div class="mane"></div>
                <div class="lion-face"></div>
                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>
                <div class="nose"></div>
                <div class="lion-arm"></div>
                <div class="claw claw1"></div>
                <div class="claw claw2"></div>
                <div class="claw claw3"></div>

                <!-- bottom -->
                <div class="base"></div>
            </div>

            <div class="shelf"></div>
            <div class="shelf-bottom"></div>

            <div class="label">
                <b>Lion felling a bull, from a marble pediment</b>
                <br>Greek, Attic, ca. 525–500 B.C.
            </div>

        </section>

    </body>
</html>
